name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.natives }})
    # The unit tests load the webrtc-java natives of each platform (13.2.2). The integration tests need
    # the demo image, which is only for amd64, and the host network of Docker, so they only run on
    # Linux x86_64 and skip themselves elsewhere.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            natives: linux-x86_64
          - os: ubuntu-24.04-arm
            natives: linux-aarch64
          - os: macos-15
            natives: macos-aarch64
          - os: macos-15-intel
            natives: macos-x86_64
          - os: windows-2025
            natives: windows-x86_64
          - os: windows-11-arm
            natives: windows-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Validates the wrapper jar and caches the Gradle user home. Only builds
      # on main write to the cache; pull requests read from it.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - run: ./gradlew build

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.natives }}
          path: |
            jmediasoup/build/reports/tests/
            jmediasoup/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
