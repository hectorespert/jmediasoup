[versions]
jackson-annotations = "2.22"
jackson2 = "2.22.4"
jackson3 = "3.2.4"
java-module-testing = "1.8.1"
jspecify = "1.0.1"
junit-jupiter = "6.1.3"
ktlint = "1.8.0"
palantir = "2.102.0"
slf4j = "2.0.20"
spotless = "8.10.4"
webrtc-java = "0.20.0"

[libraries]
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations" }
jackson2-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson2" }
jackson3-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson3" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
webrtc-java = { module = "dev.onvoid.webrtc:webrtc-java", version.ref = "webrtc-java" }

[plugins]
java-module-testing = { id = "org.gradlex.java-module-testing", version.ref = "java-module-testing" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
